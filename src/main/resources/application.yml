server:
  port: 8080
spring:
  # 本地开发默认激活 local profile，从 ./config/application-local.yml 读真实密钥（该目录已 gitignore）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: psych-ai-assistant
  datasource:
    url: jdbc:mysql://localhost:3306/psych_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
deepseek:
  api-key: ${ZHIPU_API_KEY:}
  base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
  model: ${ZHIPU_MODEL:glm-4-flash}
  connect-timeout-seconds: 10
  read-timeout-seconds: 60
  stream-timeout-seconds: 90
  history-limit: 20
jwt:
  secret: ${JWT_SECRET:PsychAiAssistant_Jwt_Secret_2026_Please_Change_Me_0123456789}
  expire-hours: 72
logging:
  level:
    com.psych.ai: INFO
