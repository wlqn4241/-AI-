<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暖心 · 心理健康 AI 助手</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f4f6fb; color: #2b2f36; height: 100vh; overflow: hidden; }
  button { cursor: pointer; border: none; border-radius: 8px; font-family: inherit; }
  input, textarea, select { font-family: inherit; border: 1px solid #d9dee8; border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; width: 100%; }
  input:focus, textarea:focus { border-color: #6c8cff; }
  .btn-primary { background: #5b7cfa; color: #fff; padding: 10px 18px; font-size: 14px; }
  .btn-primary:hover { background: #4a6ae8; }
  .btn-ghost { background: #eef1f8; color: #4a5568; padding: 8px 14px; font-size: 13px; }
  .btn-ghost:hover { background: #e2e7f2; }
  .hidden { display: none !important; }
  #authView { display: flex; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(135deg, #e8eeff 0%, #f6e9f7 100%); }
  .auth-card { width: 380px; background: #fff; border-radius: 16px; padding: 36px 32px; box-shadow: 0 12px 40px rgba(90,110,200,.15); }
  .auth-card h1 { font-size: 22px; margin-bottom: 6px; color: #3d4a9e; }
  .auth-card .sub { color: #8a92a6; font-size: 13px; margin-bottom: 22px; }
  .auth-card input { margin-bottom: 14px; }
  .auth-switch { text-align: center; margin-top: 14px; font-size: 13px; color: #6c8cff; cursor: pointer; }
  .auth-tip { margin-top: 16px; font-size: 12px; color: #a0a7b8; line-height: 1.7; }
  #appView { display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #fff; border-bottom: 1px solid #eceff5; }
  header .logo { font-size: 18px; font-weight: bold; color: #3d4a9e; }
  header .user { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #6a7284; }
  nav { display: flex; gap: 6px; padding: 10px 24px; background: #fff; border-bottom: 1px solid #eceff5; }
  nav .tab { padding: 8px 20px; border-radius: 20px; background: transparent; color: #6a7284; font-size: 14px; }
  nav .tab.active { background: #5b7cfa; color: #fff; }
  main { flex: 1; overflow: hidden; }
  section.tab-panel { height: 100%; overflow: auto; padding: 20px 24px; }
  .chat-layout { display: flex; gap: 16px; height: 100%; }
  .session-list { width: 230px; background: #fff; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
  .session-item { padding: 10px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #4a5568; }
  .session-item:hover { background: #f0f3fb; }
  .session-item.active { background: #e8edff; color: #3d4a9e; }
  .session-item .del { color: #c0c6d4; font-size: 12px; }
  .session-item .del:hover { color: #e05a5a; }
  .chat-main { flex: 1; display: flex; flex-direction: column; background: #fff; border-radius: 12px; overflow: hidden; }
  .msg-area { flex: 1; overflow: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 72%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #5b7cfa; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #f2f4fa; color: #333; border-bottom-left-radius: 4px; }
  .msg.assistant.crisis { background: #fff4f4; border: 1px solid #f3c1c1; }
  .chat-input { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid #eceff5; }
  .chat-input textarea { resize: none; height: 52px; }
  .chat-empty { margin: auto; text-align: center; color: #9aa2b5; }
  .chat-empty .big { font-size: 40px; margin-bottom: 10px; }
  .emotion-layout { display: grid; grid-template-columns: 360px 1fr; gap: 16px; height: 100%; }
  .card { background: #fff; border-radius: 12px; padding: 20px; }
  .card h3 { font-size: 15px; margin-bottom: 14px; color: #3d4a9e; }
  .mood-row { display: flex; justify-content: space-between; margin: 10px 0 16px; }
  .mood-opt { font-size: 26px; padding: 8px 10px; border-radius: 10px; border: 2px solid transparent; background: transparent; transition: all .15s; }
  .mood-opt.sel { border-color: #5b7cfa; background: #eef2ff; transform: scale(1.12); }
  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .tag-chip { padding: 6px 14px; border-radius: 16px; background: #f0f3fb; color: #5a6376; font-size: 13px; border: 1px solid transparent; }
  .tag-chip.sel { background: #e8edff; color: #3d4a9e; border-color: #9db0ff; }
  .stats-summary { display: flex; gap: 14px; margin-bottom: 14px; }
  .stat-box { flex: 1; background: #f7f9ff; border-radius: 10px; padding: 12px; text-align: center; }
  .stat-box .v { font-size: 20px; font-weight: bold; color: #3d4a9e; }
  .stat-box .k { font-size: 12px; color: #8a92a6; margin-top: 4px; }
  .chart { width: 100%; height: 260px; }
  .diary-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow: auto; }
  .diary-item { background: #f7f9ff; border-radius: 10px; padding: 10px 14px; font-size: 13px; }
  .diary-item .meta { color: #8a92a6; font-size: 12px; margin-bottom: 4px; }
  .scale-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .scale-card { background: #fff; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
  .scale-card h3 { color: #3d4a9e; font-size: 16px; }
  .scale-card p { font-size: 13px; color: #7a8296; line-height: 1.7; flex: 1; }
  .quiz-view { max-width: 760px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 26px; }
  .quiz-q { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px dashed #e7eaf3; }
  .quiz-q .qtext { font-size: 14px; margin-bottom: 8px; }
  .quiz-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .quiz-opt { padding: 6px 14px; border-radius: 16px; background: #f0f3fb; font-size: 13px; border: 1px solid transparent; }
  .quiz-opt.sel { background: #5b7cfa; color: #fff; }
  .report-box { background: #f7f9ff; border-radius: 10px; padding: 18px; white-space: pre-wrap; font-size: 14px; line-height: 1.8; margin-top: 14px; }
  .severity-pill { display: inline-block; padding: 4px 14px; border-radius: 14px; font-size: 13px; margin-left: 8px; }
  .sev-low { background: #e6f7ec; color: #2e9e5b; } .sev-mid { background: #fff6e5; color: #d98a00; } .sev-high { background: #fdeaea; color: #d84a4a; }
  .record-item { background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .record-item:hover { box-shadow: 0 4px 14px rgba(90,110,200,.12); }
  .record-item .info .name { font-size: 14px; font-weight: bold; }
  .record-item .info .time { font-size: 12px; color: #9aa2b5; margin-top: 4px; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333c52; color: #fff; padding: 10px 22px; border-radius: 10px; font-size: 14px; z-index: 999; display: none; }
</style>
</head>
<body>
<!-- 登录 / 注册 -->
<div id="authView">
  <div class="auth-card">
    <h1>暖心 · 心理健康助手</h1>
    <div class="sub">倾诉、记录、了解自己 —— AI 温柔陪伴</div>
    <div id="loginForm">
      <input id="loginUsername" placeholder="用户名" maxlength="20">
      <input id="loginPassword" type="password" placeholder="密码" maxlength="32">
      <button class="btn-primary" style="width:100%" onclick="doLogin()">登 录</button>
      <div class="auth-switch" onclick="switchAuth(false)">没有账号？去注册 →</div>
    </div>
    <div id="registerForm" class="hidden">
      <input id="regUsername" placeholder="用户名（3-20 位字母数字）" maxlength="20">
      <input id="regNickname" placeholder="昵称（可选）" maxlength="20">
      <input id="regPassword" type="password" placeholder="密码（6-32 位）" maxlength="32">
      <button class="btn-primary" style="width:100%" onclick="doRegister()">注 册</button>
      <div class="auth-switch" onclick="switchAuth(true)">已有账号？去登录 →</div>
    </div>
    <div class="auth-tip">本应用为心理健康陪伴工具，不构成医疗诊断。<br>如遇紧急情况，请拨打 24 小时心理援助热线 <b>12356</b></div>
  </div>
</div>
<!-- 主应用 -->
<div id="appView" class="hidden">
  <header>
    <div class="logo">💚 暖心 · 心理健康 AI 助手</div>
    <div class="user"><span id="nickname"></span><button class="btn-ghost" onclick="logout()">退出</button></div>
  </header>
  <nav>
    <button class="tab active" data-tab="chat" onclick="switchTab('chat')">心理咨询</button>
    <button class="tab" data-tab="emotion" onclick="switchTab('emotion')">情绪记录</button>
    <button class="tab" data-tab="assess" onclick="switchTab('assess')">心理测评</button>
    <button class="tab" data-tab="report" onclick="switchTab('report')">我的报告</button>
  </nav>
  <main>
    <section class="tab-panel" id="tab-chat">
      <div class="chat-layout">
        <div class="session-list">
          <button class="btn-primary" style="width:100%" onclick="newSession()">＋ 新的对话</button>
          <div id="sessionItems" style="display:flex;flex-direction:column;gap:4px"></div>
        </div>
        <div class="chat-main">
          <div class="msg-area" id="msgArea">
            <div class="chat-empty"><div class="big">🌱</div>选择一个对话，或点击「新的对话」<br>把今天的心情说给我听</div>
          </div>
          <div class="chat-input">
            <textarea id="chatInput" placeholder="今天感觉怎么样？想聊点什么？（Enter 发送，Shift+Enter 换行）"></textarea>
            <button class="btn-primary" onclick="sendMessage()" id="sendBtn">发送</button>
          </div>
        </div>
      </div>
    </section>
    <section class="tab-panel hidden" id="tab-emotion">
      <div class="emotion-layout">
        <div class="card">
          <h3>📝 记录今天的心情</h3>
          <input type="date" id="emoDate" style="margin-bottom:12px">
          <div style="font-size:13px;color:#7a8296">此刻的心情</div>
          <div class="mood-row" id="moodRow"></div>
          <div style="font-size:13px;color:#7a8296">情绪标签</div>
          <div class="tag-row" id="tagRow"></div>
          <textarea id="emoContent" rows="4" placeholder="今天发生了什么？想记下点什么…（选填）"></textarea>
          <button class="btn-primary" style="width:100%;margin-top:12px" onclick="saveEmotion()">保存记录</button>
        </div>
        <div class="card">
          <h3>📈 情绪趋势（近 14 天）</h3>
          <div class="stats-summary">
            <div class="stat-box"><div class="v" id="statAvg">-</div><div class="k">平均心情分</div></div>
            <div class="stat-box"><div class="v" id="statCount">-</div><div class="k">记录天数</div></div>
          </div>
          <div class="chart" id="moodChart"></div>
          <div class="chart" id="tagChart" style="height:200px"></div>
          <h3 style="margin-top:14px">📔 情绪日记</h3>
          <div class="diary-list" id="diaryList"></div>
        </div>
      </div>
    </section>
    <section class="tab-panel hidden" id="tab-assess">
      <div id="scaleGrid"></div>
      <div id="quizView" class="quiz-view hidden"></div>
    </section>
    <section class="tab-panel hidden" id="tab-report">
      <div class="card" style="max-width:860px;margin:0 auto">
        <h3>🗂 我的测评报告</h3>
        <div id="recordList"></div>
        <div id="recordDetail" class="report-box hidden"></div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const TOKEN_KEY = 'psych_token', NICK_KEY = 'psych_nick';
const $ = id => document.getElementById(id);
const token = () => localStorage.getItem(TOKEN_KEY) || '';
let currentSessionId = null, currentScale = null, quizAnswers = [], chatLoading = false;

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}
async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token() } };
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(path, opts);
  if (resp.status === 401) { logout(); throw new Error('请先登录'); }
  const json = await resp.json();
  if (json.code !== 0) throw new Error(json.message || '请求失败');
  return json.data;
}
function logout() { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(NICK_KEY); location.reload(); }
function switchAuth(toLogin) { $('loginForm').classList.toggle('hidden', !toLogin); $('registerForm').classList.toggle('hidden', toLogin); }

async function doLogin() {
  try { const d = await api('/api/auth/login', 'POST', { username: $('loginUsername').value.trim(), password: $('loginPassword').value }); enterApp(d); }
  catch (e) { toast(e.message); }
}
async function doRegister() {
  try { const d = await api('/api/auth/register', 'POST', { username: $('regUsername').value.trim(), password: $('regPassword').value, nickname: $('regNickname').value.trim() }); enterApp(d); }
  catch (e) { toast(e.message); }
}
function enterApp(d) {
  localStorage.setItem(TOKEN_KEY, d.token);
  localStorage.setItem(NICK_KEY, d.nickname);
  $('authView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('nickname').textContent = '👋 ' + d.nickname;
  initChat(); initEmotion(); loadScales();
}

async function initChat() { await loadSessions(); if (!currentSessionId) newSession(); }
async function loadSessions() {
  const list = await api('/api/chat/sessions');
  $('sessionItems').innerHTML = list.map(s =>
    `<div class="session-item ${s.id === currentSessionId ? 'active' : ''}" onclick="openSession(${s.id})">
       <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.title || '新对话'}</span>
       <span class="del" onclick="event.stopPropagation();delSession(${s.id})">✕</span></div>`).join('');
}
async function newSession() {
  const s = await api('/api/chat/sessions', 'POST');
  currentSessionId = s.id;
  $('msgArea').innerHTML = `<div class="chat-empty"><div class="big">🌱</div>把今天的心情说给我听</div>`;
  await loadSessions();
}
async function openSession(id) {
  currentSessionId = id;
  const msgs = await api(`/api/chat/sessions/${id}/messages`);
  renderMessages(msgs);
  await loadSessions();
}
async function delSession(id) {
  if (!confirm('删除这个对话？')) return;
  await api(`/api/chat/sessions/${id}`, 'DELETE');
  if (currentSessionId === id) { currentSessionId = null; newSession(); }
  loadSessions();
}
function renderMessages(msgs) {
  $('msgArea').innerHTML = msgs.length ? msgs.map(m => msgHtml(m.role, m.content)).join('')
    : `<div class="chat-empty"><div class="big">🌱</div>把今天的心情说给我听</div>`;
  $('msgArea').scrollTop = $('msgArea').scrollHeight;
}
function msgHtml(role, content) {
  const crisis = role === 'assistant' && content.includes('12356') && content.length > 80;
  return `<div class="msg ${role} ${crisis ? 'crisis' : ''}">${escapeHtml(content)}</div>`;
}
function escapeHtml(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

async function sendMessage() {
  if (chatLoading) return;
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text || !currentSessionId) return;
  chatLoading = true; $('sendBtn').disabled = true;
  input.value = '';
  $('msgArea').insertAdjacentHTML('beforeend', msgHtml('user', text));
  const aiBubble = document.createElement('div');
  aiBubble.className = 'msg assistant';
  aiBubble.innerHTML = '<span class="typing">…</span>';
  $('msgArea').appendChild(aiBubble);
  $('msgArea').scrollTop = $('msgArea').scrollHeight;
  try {
    const resp = await fetch(`/api/chat/sessions/${currentSessionId}/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token() },
      body: JSON.stringify({ content: text })
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', content = '', finished = false;
    while (!finished) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();           // 最后一行可能不完整，留在缓冲区
      for (const rawLine of lines) {
        const line = rawLine.replace(/\r$/, '');
        // 后端 SseEmitter 推的是纯文本 token：一行一个 data:
        if (!line.startsWith('data:')) continue;
        let data = line.slice(5);
        if (data.startsWith(' ')) data = data.slice(1);  // SSE 规范：冒号后最多一个空格，其余属于内容
        if (data === '[DONE]') { finished = true; break; }
        // Spring 会把 token 里的换行拆成多个 data: 行，空载荷即代表一个换行
        content += (data === '' ? '\n' : data);
      }
      aiBubble.textContent = content;
      $('msgArea').scrollTop = $('msgArea').scrollHeight;
    }
    if (!content) aiBubble.textContent = 'AI 暂时没有回复，请稍后再试';
  } catch (e) {
    aiBubble.textContent = '发送失败: ' + e.message;
  }
  chatLoading = false; $('sendBtn').disabled = false;
  await loadSessions();
}

let selMood = 3, selTags = new Set();
function initEmotion() {
  $('emoDate').value = new Date().toISOString().slice(0, 10);
  const moods = ['😞','😔','😐','🙂','😄'];
  $('moodRow').innerHTML = moods.map((m, i) => `<button class="mood-opt ${i+1===3?'sel':''}" onclick="pickMood(${i+1})">${m}</button>`).join('');
  const tags = ['平静','开心','焦虑','压力大','疲惫','迷茫','孤独','愤怒','恐惧','感激'];
  $('tagRow').innerHTML = tags.map(t => `<span class="tag-chip" onclick="pickTag(this,'${t}')">${t}</span>`).join('');
  loadEmotionData();
}
function pickMood(v) { selMood = v; document.querySelectorAll('.mood-opt').forEach(b => b.classList.toggle('sel', b === document.querySelectorAll('.mood-opt')[v-1])); }
function pickTag(el, t) { el.classList.toggle('sel'); selTags.has(t) ? selTags.delete(t) : selTags.add(t); }

async function saveEmotion() {
  try {
    await api('/api/emotion', 'POST', { mood: selMood, tags: Array.from(selTags), diary: $('emoContent').value, recordDate: $('emoDate').value });
    toast('记录已保存'); $('emoContent').value = ''; selTags.clear();
    document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('sel'));
    await loadEmotionData();
  } catch (e) { toast(e.message); }
}

let moodChart, tagChart;
async function loadEmotionData() {
  try {
    const data = await api('/api/emotion/stats?days=14');
    $('statAvg').textContent = data.avgMood != null ? data.avgMood.toFixed(1) : '-';
    $('statCount').textContent = data.recordDays || 0;
    const dates = (data.dailyStats || []).map(d => d.date.slice(5));
    const moods = (data.dailyStats || []).map(d => d.avgMood);
    if (!moodChart) moodChart = echarts.init($('moodChart'));
    moodChart.setOption({
      tooltip: { trigger: 'axis' },
      grid: { left: 30, right: 20, top: 20, bottom: 30 },
      xAxis: { type: 'category', data: dates, axisLabel: { fontSize: 11 } },
      yAxis: { type: 'value', min: 1, max: 5, axisLabel: { fontSize: 11 } },
      series: [{ data: moods, type: 'line', smooth: true, itemStyle: { color: '#5b7cfa' }, areaStyle: { color: 'rgba(91,124,250,0.1)' } }]
    });
    const tagNames = Object.keys(data.tagCounts || {});
    const tagVals = tagNames.map(k => data.tagCounts[k]);
    if (!tagChart) tagChart = echarts.init($('tagChart'));
    tagChart.setOption({
      tooltip: { trigger: 'axis' },
      grid: { left: 70, right: 20, top: 20, bottom: 20 },
      xAxis: { type: 'value' },
      yAxis: { type: 'category', data: tagNames },
      series: [{ data: tagVals, type: 'bar', itemStyle: { color: '#7c92ff' } }]
    });
    $('diaryList').innerHTML = (data.diaries || []).slice(-10).reverse().map(d => `<div class="diary-item"><div class="meta">📅 ${d.date}</div>${escapeHtml(d.content || '（无日记）')}</div>`).join('') || '<div style="color:#9aa2b5;font-size:13px">还没有日记记录</div>';
  } catch (e) { console.error(e); }
}

async function loadScales() {
  try {
    const scales = await api('/api/assessment/scales');
    $('scaleGrid').innerHTML = scales.map(s => `<div class="scale-card"><h3>${s.name}</h3><p>${s.description || ''}</p><button class="btn-primary" style="align-self:flex-start" onclick="startScale('${s.code}')">开始测试</button></div>`).join('');
  } catch (e) { console.error(e); }
}

async function startScale(code) {
  try {
    const scale = await api(`/api/assessment/scales/${code}`);
    // 后端 JPA 实体返回的是 questionsJson（JSON 字符串），前端需要手动 parse
    if (scale.questionsJson) {
      try { scale.questions = JSON.parse(scale.questionsJson); } catch(e) { scale.questions = []; }
    }
    currentScale = scale; quizAnswers = [];
    renderQuiz();
    $('scaleGrid').style.display = 'none';
    $('quizView').classList.remove('hidden');
  } catch (e) { toast(e.message); }
}

function renderQuiz() {
  const questions = Array.isArray(currentScale.questions) ? currentScale.questions : [];
  let html = `<h3 style="text-align:center;color:#3d4a9e;margin-bottom:20px">${escapeHtml(currentScale.name || '')}</h3>`;
  if (!questions.length) {
    html += '<div style="text-align:center;color:#9aa2b5">题目加载失败，请稍后重试</div>';
  }
  questions.forEach((q, i) => {
    const qText = typeof q === 'string' ? q
      : (q.text || q.title || q.question || q.content || q.label || `第 ${i + 1} 题`);
    const options = Array.isArray(q && q.options) ? q.options : [];
    html += `<div class="quiz-q"><div class="qtext">${i + 1}. ${escapeHtml(qText)}</div><div class="quiz-opts">`;
    options.forEach((opt, j) => {
      html += `<span class="quiz-opt ${quizAnswers[i] === j ? 'sel' : ''}" onclick="pickOpt(${i},${j})">${escapeHtml(optLabel(opt, j))}</span>`;
    });
    html += '</div></div>';
  });
  html += `<div style="text-align:center;margin-top:16px"><button class="btn-primary" onclick="submitScale()">提交</button>
    <button class="btn-ghost" style="margin-left:8px" onclick="backToScales()">返回</button></div>`;
  $('quizView').innerHTML = html;
}

/**
 * 取选项显示文字。
 * 后端 questionsJson 里的 options 是对象数组：[{"label":"完全不会","score":0}, ...]
 * 直接 ${opt} 会渲染成 [object Object]，所以这里按常见字段名逐个兜底。
 */
function optLabel(opt, idx) {
  if (opt === null || opt === undefined) return `选项 ${idx + 1}`;
  if (typeof opt === 'string') return opt;
  if (typeof opt === 'number') return String(opt);
  if (typeof opt !== 'object') return String(opt);
  const keys = ['label', 'text', 'content', 'value', 'name', 'title', 'desc', 'description', 'option'];
  for (const k of keys) {
    const v = opt[k];
    if (typeof v === 'string' && v.trim()) return v;
  }
  for (const v of Object.values(opt)) {
    if (typeof v === 'string' && v.trim()) return v;
  }
  return `选项 ${idx + 1}`;
}

function pickOpt(i, j) { quizAnswers[i] = j; renderQuiz(); }

function backToScales() { $('quizView').classList.add('hidden'); $('scaleGrid').style.display = 'grid'; }

async function submitScale() {
  const total = (currentScale.questions || []).length;
  for (let i = 0; i < total; i++) {
    if (quizAnswers[i] === undefined || quizAnswers[i] === null) { toast(`第 ${i + 1} 题还没作答`); return; }
  }
  try {
    // 后端路径是 POST /api/assessment/scales/{code}/submit，code 在 URL 里
    const rec = await api(`/api/assessment/scales/${currentScale.code}/submit`, 'POST', { answers: quizAnswers });
    $('quizView').innerHTML = `<h3 style="text-align:center;color:#3d4a9e">${currentScale.name} 完成</h3>
      <p style="text-align:center;font-size:20px;margin-top:12px">得分：<b style="color:#3d4a9e;font-size:32px">${rec.score}</b> 分
      <span class="severity-pill ${sevClass(rec.score, currentScale.code)}">${rec.severity}</span></p>
      <div class="report-box">${rec.report || rec.aiSuggestion || ''}</div>
      <div style="text-align:center;margin-top:16px"><button class="btn-primary" onclick="switchTab('report')">查看我的报告</button>
      <button class="btn-ghost" style="margin-left:8px" onclick="backToScales();loadSessions()">返回测评列表</button></div>`;
  } catch (e) { toast(e.message); }
}

function sevClass(score, code) {
  const low = code === 'PHQ9' ? 4 : code === 'GAD7' ? 4 : 5;
  const mid = code === 'PHQ9' ? 9 : code === 'GAD7' ? 9 : 14;
  if (score <= low) return 'sev-low';
  if (score <= mid) return 'sev-mid';
  return 'sev-high';
}

async function loadRecords() {
  try {
    const list = await api('/api/assessment/records');
    $('recordList').innerHTML = list.length ? list.map(r => `<div class="record-item" onclick="viewRecord(${r.id})"><div class="info"><div class="name">${r.scaleName}</div><div class="time">${r.createdAt} · ${r.score} 分</div></div><span>→</span></div>`).join('') : '<div class="card" style="text-align:center;color:#9aa2b5">还没有测评记录，去心理测评 tab 开始第一次吧</div>';
    $('recordDetail').classList.add('hidden');
  } catch (e) { console.error(e); }
}

async function viewRecord(id) {
  try {
    const r = await api(`/api/assessment/records/${id}`);
    $('recordDetail').classList.remove('hidden');
    $('recordDetail').innerHTML = `<h3 style="margin-bottom:10px">${r.scaleName} · ${r.score} 分 · ${r.severity}</h3><div>完成时间：${r.createdAt}</div>
      <div class="report-box">${r.report || r.aiSuggestion || '（暂无建议）'}</div>`;
  } catch (e) { toast(e.message); }
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(s => s.classList.toggle('hidden', s.id !== 'tab-' + name));
  if (name === 'report') loadRecords();
  if (name === 'emotion') { initEmotion(); if (moodChart) moodChart.resize(); if (tagChart) tagChart.resize(); }
}

(function init() {
  if (token() && !location.search.includes('logout')) {
    api('/api/auth/me').then(d => {
      localStorage.setItem(NICK_KEY, d.nickname);
      $('authView').classList.add('hidden');
      $('appView').classList.remove('hidden');
      $('nickname').textContent = '👋 ' + d.nickname;
      initChat(); initEmotion(); loadScales();
    }).catch(() => logout());
  }
})();
</script>
</body>
